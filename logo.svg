<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal / Shield Industrial Frame -->
  <polygon points="120,12 216,66 216,174 120,228 24,174 24,66" 
           stroke="url(#goldGrad)" stroke-width="4" fill="#0B111E" filter="drop-shadow(0 4px 20px rgba(245,158,11,0.25))" />

  <!-- Inner precision border -->
  <polygon points="120,24 204,72 204,168 120,216 36,168 36,72" 
           stroke="url(#chromeGrad)" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.6" />

  <!-- Sacred Lord Ganesh Iconography combined with Geometric Architectural 'S' -->
  <g transform="translate(120, 116)">
    <!-- Top Tilak / Crown (Trishul / Tika) -->
    <path d="M-6 -76 L6 -76 L3 -52 L-3 -52 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="-45" r="4.5" fill="#EF4444" />
    <path d="M-18 -58 C-8 -68 8 -68 18 -58" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Stylized Lord Ganesh Forehead & Temples with Ear Flares forming the top loop of 'S' -->
    <!-- Left Ear / Arch -->
    <path d="M-22 -44 C-46 -40 -52 -18 -42 -2 C-34 10 -20 12 -12 6" 
          stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
    
    <!-- Big 'S' curvature that flows like Ganesh's Mastak and curves into the Trunk (Vakratunda) -->
    <!-- Top curve of S -->
    <path d="M26 -38 C14 -50 -12 -50 -26 -34 C-38 -20 -30 2 -4 14 C18 24 32 36 28 54 C24 70 8 76 -10 74 C-24 72 -34 62 -38 50" 
          stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Ganesh Trunk curl with Modak blessing at the bottom tip of S -->
    <path d="M-38 50 C-42 40 -34 32 -26 36 C-20 40 -20 48 -26 50" 
          stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Modak symbol on right side -->
    <circle cx="38" cy="34" r="5" fill="url(#goldGrad)" />
    
    <!-- Right Tusk (Ekadanta - broken tusk on right, full tusk stylized) -->
    <path d="M12 -8 L24 -8" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
    <path d="M-14 -8 L-30 -8" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
    
    <!-- Sacred Eyes -->
    <ellipse cx="-16" cy="-24" rx="4" ry="2.5" fill="#F8FAFC" transform="rotate(-15 -16 -24)" />
    <ellipse cx="16" cy="-24" rx="4" ry="2.5" fill="#F8FAFC" transform="rotate(15 16 -24)" />
    <circle cx="-16" cy="-24" r="1.5" fill="#0F172A" />
    <circle cx="16" cy="-24" r="1.5" fill="#0F172A" />
  </g>

  <!-- Bottom Brand initials label -->
  <text x="120" y="206" font-family="'Outfit', sans-serif" font-weight="800" font-size="15" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">S I C</text>
</svg>
